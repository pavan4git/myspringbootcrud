spring.application.name=taskmanager

# --- Local PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskmanager}
spring.datasource.username=${DB_USER:taskuser}
spring.datasource.password=${DB_PASSWORD:taskpass}

# --- JPA / Hibernate ---
# 'update' keeps the schema in sync automatically; swap for a migration tool
# (Flyway/Liquibase) before running this anywhere but a dev machine.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Server ---
server.port=8080

# --- CORS (Vite dev server) ---
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
